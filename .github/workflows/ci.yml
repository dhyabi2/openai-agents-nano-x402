name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: test install of the published release
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        package-manager: ["pip", "uv"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv (when uv is the manager)
        if: matrix.package-manager == 'uv'
        run: pip install uv

      # The repository's own suite runs first and on every event, so a broken
      # commit fails CI on its own merits. It used to run last, behind the
      # mirror install below, and a step that fails skips every later step in
      # the job -- so while that index was unreachable the suite was never
      # reached at all and CI reported only the mirror's health.
      - name: Run project test suite (editable install)
        run: |
          pip install -e ".[dev]"
          python3 -m pytest tests/ -q --tb=short

      # Installing what is published is the weekly check this workflow's own cron
      # describes. It is a statement about the published artifact, not about this
      # commit, so it runs on the schedule and on a manual dispatch rather than
      # gating every push.
      #
      # It used to install `openai-agents-nano` from a GitHub Pages PEP 503 index
      # on an account that has since been deleted, and the package is on no other
      # index -- README.md says so in as many words ("Until then `pip install
      # openai-agents-nano` fails with 'No matching distribution found'"). So the
      # step could only ever fail, the smoke test after it could never run, and
      # the weekly signal about what is installable was permanently red instead of
      # absent. The v0.1.0 GitHub release is the install path README.md actually
      # publishes, and it is what is checked here; `tests/test_ci_workflow.py`
      # pins that this URL is one the README offers, so the two cannot drift apart
      # again.
      - name: Install the published release (weekly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: >
          ${{ matrix.package-manager == 'uv' && 'uv pip install --system' || 'pip install' }}
          https://github.com/dhyabi2/openai-agents-nano-x402/releases/download/v0.1.0/openai_agents_nano-0.1.0-py3-none-any.whl

      - name: Import and smoke-test the installed package
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 -c "
          from openai_agents_nano import make_nano_x402_tool, NanoX402ToolError
          print(f'make_nano_x402_tool loaded: {make_nano_x402_tool}')
          print(f'NanoX402ToolError loaded: {NanoX402ToolError}')
          "

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Build sdist and wheel
        run: uv build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff
      - name: Run ruff check
        run: ruff check --output-format=github .