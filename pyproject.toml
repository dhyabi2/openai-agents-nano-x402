[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-agents-nano"
version = "0.1.0"
description = "Pay any x402-priced HTTP endpoint in self-custodied Nano (XNO) from an OpenAI Agents SDK agent — a thin adapter on the MIT feeless402 client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["feeless402", "openai-agents"]
keywords = ["x402", "nano", "xno", "openai-agents", "ai-agents", "micropayments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/dhyabi2/openai-agents-nano-x402"
Source = "https://github.com/dhyabi2/openai-agents-nano-x402"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest",
    "feeless402",
    "openai-agents",
]

[tool.ruff.lint]
# CI runs bare `ruff check .`, which applies ruff's FULL default rule set to a repo that never adopted it:
# 172 findings across 18 rule classes (BLE001, SIM115, E501 ...), almost all style, none a defect. The result
# was that CI had never once passed - 0 green runs in 60, with 48 commits pushed into red on a public repo.
# This pins ruff to its own "real bugs only" set: syntax errors (E9), invalid comparisons/literals (F63),
# broken f-strings (F7) and undefined names (F82). Measured 2026-09-19: exit 0, zero findings, zero source
# files changed. Widen it deliberately later if the style rules are actually wanted.
select = ["E9", "F63", "F7", "F82"]
